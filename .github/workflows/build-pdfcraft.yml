name: Build PDFCraft Font Editor V1
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run targeted text editor tests before building
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      PDFCRAFT_BUILD_LABEL: fonteditor.v1
      PDFCRAFT_REQUIRE_WINRES: '1'
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4
      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: ac140f809d554981a5276d748e6193fcf4d4bdfa
          path: source
          persist-credentials: false
      - name: Apply Font Editor V1 patch
        shell: pwsh
        working-directory: source
        run: |
          git apply --check ../PDFCraft_Font_Editor_V1.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch validation failed' }
          git apply ../PDFCraft_Font_Editor_V1.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
      - name: Configure Rust MSVC
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.95.0-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          rustc --version
          cargo --version
      - name: Build Windows x64
        shell: pwsh
        working-directory: source
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          if ('${{ inputs.run_tests }}' -eq 'true') {
            cargo test --locked --release --target x86_64-pc-windows-msvc -p pdfcraft-ui-egui --lib edit_text_ui::
            if ($LASTEXITCODE -ne 0) { throw 'Targeted tests failed' }
          }
          cargo build --locked --release -p pdfcraft --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Verify and stage executable
        shell: pwsh
        working-directory: source
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/pdfcraft.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw 'Missing executable' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid PE file' }
          $pe = [BitConverter]::ToInt32($bytes, 60)
          if ($pe -lt 0 -or $pe -gt ($bytes.Length - 24)) { throw 'Invalid PE offset' }
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Not a Windows x64 PE' }
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--version' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Executable version smoke test failed' }
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item $exe, LICENSE-MIT, LICENSE-APACHE, NOTICE, FONT-EDITOR-CHANGELOG.md ../dist
          Copy-Item licenses ../dist/licenses -Recurse
          (Get-FileHash ../dist/pdfcraft.exe -Algorithm SHA256).Hash | Set-Content ../dist/SHA256.txt
      - name: Upload unsigned Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-Font-Editor-V1-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
